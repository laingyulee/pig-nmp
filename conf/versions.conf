# Pig-NMP - Version Configuration
# Format: COMPONENT_VERSION="version"

# PHP Versions
PHP_VERSIONS_SUPPORTED="8.1 8.2 8.3 8.4 8.5"
PHP_VERSION_DEFAULT="8.4"

# PHP Download URLs (ordered by priority, will try each in turn)
PHP_DOWNLOAD_MIRRORS=(
    "https://www.php.net/distributions/php-{{VERSION}}.tar.gz"
    "https://secure.php.net/distributions/php-{{VERSION}}.tar.gz"
    "https://www.php.net/get/php-{{VERSION}}.tar.gz/from/this/mirror"
)

# PHP SURY Repository (APT binary)
PHP_SURY_REPO="deb [signed-by=/usr/share/keyrings/sury-php-archive-keyring.gpg] https://packages.sury.org/php/ {{CODENAME}} main"
PHP_SURY_KEY_URL="https://packages.sury.org/php/apt.gpg"

# Nginx Versions
NGINX_STABLE_VERSION="1.26.3"
NGINX_MAINLINE_VERSION="1.27.4"

# Nginx Download URLs
NGINX_SOURCE_URL="https://nginx.org/download/nginx-{{VERSION}}.tar.gz"
NGINX_APT_REPO_STABLE="deb [arch={{ARCH}} signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/{{OS_ID}}/ {{CODENAME}} nginx"
NGINX_APT_REPO_MAINLINE="deb [arch={{ARCH}} signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/mainline/{{OS_ID}}/ {{CODENAME}} nginx"

# MySQL Versions
MYSQL_VERSIONS="8.0 8.4 9.1"
MYSQL_APT_URL="https://dev.mysql.com/get/mysql-apt-config_0.8.33-1_all.deb"

# MariaDB Versions
MARIADB_VERSIONS="10.11 11.4 11.6"
MARIADB_APT_REPO="deb [arch={{ARCH}} signed-by=/usr/share/keyrings/mariadb-archive-keyring.gpg] https://deb.mariadb.org/{{VERSION}}/{{OS_ID}} {{CODENAME}} main"

# Redis
REDIS_STABLE_VERSION="8.0.2"
REDIS_LATEST_VERSION="8.6.0"
REDIS_DOWNLOAD_URL="https://download.redis.io/releases/redis-{{VERSION}}.tar.gz"

# Memcached
MEMCACHED_VERSION="1.6.38"
MEMCACHED_DOWNLOAD_URL="https://memcached.org/files/memcached-{{VERSION}}.tar.gz"

# phpMyAdmin
PHPMYADMIN_VERSION="5.2.2"
PHPMYADMIN_DOWNLOAD_URL="https://files.phpmyadmin.net/phpMyAdmin/{{VERSION}}/phpMyAdmin-{{VERSION}}-all-languages.tar.xz"

# ionCube
IONCUBE_DOWNLOAD_URL="https://downloads.ioncube.com/loader_downloads/ioncube_loaders_lin_x86-64.tar.gz"

# acme.sh
ACME_INSTALL_URL="https://get.acme.sh"

# vsftpd
VSFTPD_VERSION="3.0.5"
VSFTPD_DOWNLOAD_URL="https://security.appspot.com/downloads/vsftpd-{{VERSION}}.tar.gz"
