# Pig-NMP - Mirror Configuration
# Set MIRROR_CN="true" in config.inc.sh to use China mirrors

# PHP Mirrors
PHP_MIRROR="https://mirrors.sohu.com/php"
get_mirror_url() {
    local url="$1"
    if [[ "$MIRROR_CN" != "true" ]]; then
        echo "$url"
        return
    fi
    case "$url" in
        *php.net/distributions/*)
            local file
            file=$(basename "$url")
            echo "${PHP_MIRROR}/${file}"
            ;;
        *nginx.org/download/*)
            local file
            file=$(basename "$url")
            echo "https://mirrors.huaweicloud.com/nginx/${file}"
            ;;
        *download.redis.io/*)
            local file
            file=$(basename "$url")
            echo "https://mirrors.huaweicloud.com/redis/${file}"
            ;;
        *phpmyadmin.net/*)
            local file
            file=$(basename "$url")
            echo "https://mirrors.huaweicloud.com/phpmyadmin/${file}"
            ;;
        *)
            echo "$url"
            ;;
    esac
}
